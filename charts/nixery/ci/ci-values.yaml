# Values for CI (Kind), `helm lint -f`, and `helm template` smoke tests.
# On PR CI, the workflow builds nixery, tags it nixery:ci, and kind-loads it (see on-pr.yaml).
replicaCount: 1

fullnameOverride: nixery-ci

image:
  repository: nixery
  tag: ci
  # Use local image after `kind load` in CI; avoids pulling from a registry inside the cluster.
  pullPolicy: IfNotPresent


service:
  type: ClusterIP
  port: 8080

nixery:
  channel: "nixpkgs-unstable"
  pkgsRepo: ""
  pkgsPath: ""
  timeout: "3600"

storage:
  backend: filesystem
  filesystem:
    storagePath: /var/lib/nixery-storage
    emptyDir:
      enabled: true
      sizeLimit: 8Gi
    persistence:
      enabled: false

tmp:
  emptyDir:
    enabled: true
    sizeLimit: 8Gi

podDisruptionBudget:
  enabled: false

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 4Gi
